<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    :root {
      --shed-fill: #0F172A;   /* Deep Slate 900 */
      --bar-fill: #0EA5E9;    /* rgb(14 165 233) */
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --shed-fill: #0EA5E9; /* Inverts shed to vibrant accent */
        --bar-fill: #0F172A;  /* Inverts lines to high-contrast cutouts */
      }
    }
    .shed { fill: var(--shed-fill); }
    .bar  { fill: var(--bar-fill);  }
  </style>

  <!-- Gable Roof Shed Silhouette -->
  <path class="shed" d="M16 2.5 L3 12.5 V28 C3 29.1 3.9 30 5 30 H27 C28.1 30 29 29.1 29 28 V12.5 Z"/>

  <!-- Stacked Log Lines / Data Streams -->
  <rect class="bar" x="10" y="14" width="12" height="3" rx="1.5"/>
  <rect class="bar" x="7"  y="19" width="18" height="3" rx="1.5"/>
  <rect class="bar" x="7"  y="24" width="18" height="3" rx="1.5"/>
</svg>
