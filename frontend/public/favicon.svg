<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    :root {
      /* Light Mode Tab Bar: Deep Ocean Cyan (4.6+:1 WCAG contrast on white/gray) */
      --icon-color: #0284C7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        /* Dark Mode Tab Bar: Radiant Sky Cyan (5.8+:1 WCAG contrast on dark slate) */
        --icon-color: #38BDF8;
      }
    }
    .icon-frame {
      stroke: var(--icon-color, #0284C7);
      fill: none;
    }
    .icon-log {
      fill: var(--icon-color, #0284C7);
    }
  </style>

  <!-- Variation A: Open-bottom sides and roof (no bottom line) -->
  <path
    class="icon-frame"
    d="M4 27.5 V12.5 L16 3 L28 12.5 V27.5"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Stacked Log Lines / Data Streams -->
  <rect class="icon-log" x="10" y="13.5" width="12" height="2.75" rx="1.375"/>
  <rect class="icon-log" x="7.5" y="18.5" width="17" height="2.75" rx="1.375"/>
  <rect class="icon-log" x="7.5" y="23.5" width="17" height="2.75" rx="1.375"/>
</svg>
